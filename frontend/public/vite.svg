<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>

  <!-- Open book pages -->
  <path d="M 60 80 Q 60 70 70 70 L 95 70 L 95 130 L 70 130 Q 60 130 60 120 Z"
        fill="#FFFFFF" opacity="0.95"/>
  <path d="M 105 70 L 130 70 Q 140 70 140 80 L 140 120 Q 140 130 130 130 L 105 130 Z"
        fill="#FFFFFF" opacity="0.95"/>

  <!-- Book spine -->
  <rect x="98" y="70" width="4" height="60" fill="#E5E7EB"/>

  <!-- Text lines on left page -->
  <line x1="68" y1="80" x2="88" y2="80" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="88" x2="88" y2="88" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="96" x2="85" y2="96" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>

  <!-- Text lines on right page -->
  <line x1="112" y1="80" x2="132" y2="80" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="88" x2="132" y2="88" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="96" x2="132" y2="96" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>

  <!-- Journey path emerging from book -->
  <path d="M 100 130 Q 90 145 95 160 Q 100 175 110 170 Q 120 165 125 175"
        stroke="url(#pathGradient)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
        opacity="0.9"/>

  <!-- Sparkles/stars representing AI magic -->
  <circle cx="145" cy="65" r="3" fill="#FCD34D"/>
  <circle cx="155" cy="75" r="2" fill="#FBBF24"/>
  <circle cx="50" cy="65" r="2.5" fill="#FCD34D"/>
  <circle cx="45" cy="75" r="2" fill="#FBBF24"/>

  <!-- Small compass/direction indicator -->
  <circle cx="100" cy="45" r="8" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <path d="M 100 37 L 100 53 M 92 45 L 108 45"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"/>
  <circle cx="100" cy="45" r="2" fill="#FCD34D"/>
</svg>
