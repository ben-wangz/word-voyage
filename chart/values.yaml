global:
  imageRegistry: ''
  imagePullSecrets: []
commonLabels: {}
commonAnnotations: {}
credentials:
  existingSecret: ''
  jwtSecret: ''
  openai:
    baseUrl: https://api.openai.com/v1
    apiKey: ''
    model: gpt-4o
llm:
  replicas: 1
  revisionHistoryLimit: 10
  updateStrategy: {}
  image:
    repository: wordvoyage-llm
    tag: 1.0.1
    pullPolicy: IfNotPresent
  port: 8011
  resources: {}
  resourcesPreset: none
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAffinityPreset: ''
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ''
    key: ''
    values: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    enabled: false
    fsGroup: 1001
    fsGroupChangePolicy: Always
    supplementalGroups: []
    sysctls: []
  containerSecurityContext:
    enabled: false
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  hostname: ''
  extraEnvVars: []
  extraEnvVarsSecret: ''
  extraVolumeMounts: []
  extraVolumes: []
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  startupProbe:
    enabled: false
    initialDelaySeconds: 60
    periodSeconds: 15
  service:
    type: ClusterIP
    port: 8011
    nodePort: ''
    clusterIP: ''
    externalTrafficPolicy: Cluster
    sessionAffinity: ''
    sessionAffinityConfig: {}
    loadBalancerIP: ''
    loadBalancerSourceRanges: []
    loadBalancerClass: ''
    annotations: {}
    extraPorts: []
