global:
  imageRegistry: ""
  imagePullSecrets: []

commonLabels: {}
commonAnnotations: {}

# Credentials
credentials:
  # Use existing secret (if set, the chart will not create a new secret)
  existingSecret: ""
  # JWT secret (only used when existingSecret is not set)
  # If empty, a deterministic value will be generated based on release name and namespace
  jwtSecret: ""
  # OpenAI configuration (required, only used when existingSecret is not set)
  openai:
    baseUrl: "https://api.openai.com/v1"
    apiKey: ""
    model: "gpt-4o"

# LLM Service
llm:
  replicas: 1
  revisionHistoryLimit: 10
  updateStrategy: {}
  #  type: RollingUpdate
  #  rollingUpdate:
  #    maxSurge: 1
  #    maxUnavailable: 0
  image:
    repository: wordvoyage-llm
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8011
  resources: {}
  resourcesPreset: "none"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    enabled: false
    fsGroup: 1001
    fsGroupChangePolicy: Always
    supplementalGroups: []
    sysctls: []
  containerSecurityContext:
    enabled: false
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  hostname: ""
  extraEnvVars: []
  extraEnvVarsSecret: ""
  extraVolumeMounts: []
  extraVolumes: []
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  startupProbe:
    enabled: false
    initialDelaySeconds: 60
    periodSeconds: 15
  service:
    type: ClusterIP
    port: 8011
    nodePort: ""
    clusterIP: ""
    externalTrafficPolicy: Cluster
    sessionAffinity: ""
    sessionAffinityConfig: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    annotations: {}
    extraPorts: []

# Frontend Service
frontend:
  replicas: 1
  revisionHistoryLimit: 10
  updateStrategy: {}
  #  type: RollingUpdate
  #  rollingUpdate:
  #    maxSurge: 1
  #    maxUnavailable: 0
  image:
    repository: wordvoyage-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 3000
  resources: {}
  resourcesPreset: "none"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    enabled: false
    fsGroup: 1001
    fsGroupChangePolicy: Always
    supplementalGroups: []
    sysctls: []
  containerSecurityContext:
    enabled: false
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  hostname: ""
  extraEnvVars: []
  extraEnvVarsSecret: ""
  extraVolumeMounts: []
  extraVolumes: []
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  startupProbe:
    enabled: false
    initialDelaySeconds: 60
    periodSeconds: 15
  service:
    type: ClusterIP
    port: 3000
    nodePort: ""
    clusterIP: ""
    externalTrafficPolicy: Cluster
    sessionAffinity: ""
    sessionAffinityConfig: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    annotations: {}
    extraPorts: []

# Backend Service
backend:
  replicas: 1
  revisionHistoryLimit: 10
  updateStrategy: {}
  #  type: RollingUpdate
  #  rollingUpdate:
  #    maxSurge: 1
  #    maxUnavailable: 0
  image:
    repository: wordvoyage-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8080
  resources: {}
  resourcesPreset: "none"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    enabled: false
    fsGroup: 1001
    fsGroupChangePolicy: Always
    supplementalGroups: []
    sysctls: []
  containerSecurityContext:
    enabled: false
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  hostname: ""
  extraEnvVars:
    - name: LLM_MAX_TOKENS
      value: "3000"
  extraEnvVarsSecret: ""
  extraVolumeMounts: []
  extraVolumes: []
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  startupProbe:
    enabled: false
    initialDelaySeconds: 60
    periodSeconds: 15
  service:
    type: ClusterIP
    port: 8080
    nodePort: ""
    clusterIP: ""
    externalTrafficPolicy: Cluster
    sessionAffinity: ""
    sessionAffinityConfig: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    annotations: {}
    extraPorts: []

# Redis configuration (bitnami/redis subchart)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    service:
      ports:
        redis: 6379
  # External Redis (when redis.enabled=false)
  external:
    host: ""
    port: 6379

# Ingress configuration
ingress:
  enabled: false
  ingressClassName: ""
  hostname: word-voyage.local
  path: /
  pathType: Prefix
  annotations: {}
  tls: false
  tlsSecret: ""
  extraHosts: []
