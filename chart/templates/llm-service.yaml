apiVersion: v1
kind: Service
metadata:
  name: {{ include "word-voyage.llm.service.name" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: llm
  {{- if or .Values.llm.service.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.llm.service.annotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.llm.podLabels .Values.commonLabels ) "context" . ) }}
  type: {{ .Values.llm.service.type }}
  {{- if and .Values.llm.service.clusterIP (eq .Values.llm.service.type "ClusterIP") }}
  clusterIP: {{ .Values.llm.service.clusterIP }}
  {{- end }}
  {{- if .Values.llm.service.sessionAffinity }}
  sessionAffinity: {{ .Values.llm.service.sessionAffinity }}
  {{- end }}
  {{- if .Values.llm.service.sessionAffinityConfig }}
  sessionAffinityConfig: {{- include "common.tplvalues.render" (dict "value" .Values.llm.service.sessionAffinityConfig "context" $) | nindent 4 }}
  {{- end }}
  {{- if or (eq .Values.llm.service.type "LoadBalancer") (eq .Values.llm.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.llm.service.externalTrafficPolicy | quote }}
  {{- end }}
  {{- if and (eq .Values.llm.service.type "LoadBalancer") (not (empty .Values.llm.service.loadBalancerSourceRanges)) }}
  loadBalancerSourceRanges: {{- toYaml .Values.llm.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (eq .Values.llm.service.type "LoadBalancer") (not (empty .Values.llm.service.loadBalancerIP)) }}
  loadBalancerIP: {{ .Values.llm.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.llm.service.type "LoadBalancer") .Values.llm.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.llm.service.loadBalancerClass }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.llm.service.port }}
      targetPort: http
      protocol: TCP
      {{- if (and (eq .Values.llm.service.type "NodePort") (not (empty .Values.llm.service.nodePort))) }}
      nodePort: {{ .Values.llm.service.nodePort }}
      {{- end }}
    {{- if .Values.llm.service.extraPorts }}
    {{- include "common.tplvalues.render" (dict "value" .Values.llm.service.extraPorts "context" $) | nindent 4 }}
    {{- end }}
  selector: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: llm
