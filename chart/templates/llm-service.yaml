apiVersion: v1
kind: Service
metadata:
  name: {{ include "word-voyage.llm.service.name" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: llm
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.llm.service.type }}
  ports:
    - name: http
      port: {{ .Values.llm.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.llm.podLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: llm
